<!doctype html>
<html lang="zh-CN">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>过程就是奖励</title>
  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
	background: #000;
	overflow: hidden;
	font-family: "Microsoft YaHei", sans-serif;
  }

  /* ===== 全局返回按钮（5px 小箭头，可点击区域稍大） ===== */
  #backBtn {
	position: fixed;
	top: 12px;
	left: 12px;
	z-index: 10001;
	font-size: 5px;
	line-height: 1;
	color: rgba(255, 255, 255, .8);
	background: transparent;
	border: none;
	cursor: pointer;
	padding: 8px;
	display: none;
	font-family: Consolas, monospace;
	user-select: none;
	transition: opacity .25s ease, color .25s ease;
  }
  #backBtn:hover { opacity: 1; color: #fff; }
  #backBtn:active { transform: scale(.95); }

  .page-layer {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	transition: opacity 1s ease, visibility 1s ease;
  }

  /* ================= 第一页 ================= */
  #page1 {
	z-index: 10;
	display: flex;
	align-items: center;
	justify-content: center;
	opacity: 1;
	visibility: visible;
  }
  #page1.fade-out {
	opacity: 0;
	visibility: hidden;
	pointer-events: none;
  }

  #snow-layer {
	position: absolute;
	inset: 0;
	overflow: hidden;
	pointer-events: none;
	z-index: 1;
  }

  .snowflake {
	position: absolute;
	top: -15vh;
	will-change: transform;
	animation-name: snowfall;
	animation-timing-function: linear;
	animation-iteration-count: infinite;
	mix-blend-mode: screen;
	user-select: none;
	-webkit-user-drag: none;
  }

  @keyframes snowfall {
	from { transform: translate3d(0, 0, 0) rotate(0deg); }
	to   { transform: translate3d(var(--drift), 132vh, 0) rotate(var(--spin)); }
  }

  .center {
	position: relative;
	z-index: 2;
	width: min(510px, 85vw);
	display: flex;
	flex-direction: column;
	align-items: stretch;
	gap: 16.5px;
  }

  .title {
	text-align: center;
	font-family: "FangSong", "仿宋", "STFangsong", "华文仿宋", serif;
	font-size: clamp(14.25px, 2.25vw, 24px);
	letter-spacing: .14em;
	color: #f2f9ff;
	text-shadow:
	  0 0 4.5px  rgba(190, 225, 255, .95),
	  0 0 12px  rgba(140, 190, 235, .85),
	  0 0 24px rgba(105, 160, 220, .65),
	  0 0 45px rgba(80, 135, 200, .45);
	animation: titleIn 1.6s cubic-bezier(.22, .61, .36, 1) .15s both;
	transition: opacity .8s ease, filter .8s ease, transform .8s ease;
  }

  @keyframes titleIn {
	from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
	to   { opacity: 1; transform: translateY(0);    filter: blur(0);   }
  }

  .progress-wrap {
	animation: fadeIn 1.2s ease-out .4s both;
	transition: opacity .8s ease, filter .8s ease, transform .8s ease;
  }

  @keyframes fadeIn {
	from { opacity: 0; }
	to   { opacity: 1; }
  }

  .progress-num {
	text-align: right;
	font-family: Consolas, "Courier New", monospace;
	font-size: 10.5px;
	letter-spacing: .08em;
	color: #cfe6fa;
	margin-bottom: 6px;
	text-shadow: 0 0 6px rgba(150, 200, 240, .85);
  }

  .progress-track {
	width: 100%;
	height: 19.5px;
	border: 1.5px solid #ffffff;
	border-radius: 999px;
	padding: 2.25px;
	background: rgba(255, 255, 255, .03);
	box-shadow:
	  0 0 10.5px rgba(255, 255, 255, .18),
	  inset 0 0 7.5px rgba(255, 255, 255, .06);
  }

  .progress-fill {
	height: 100%;
	width: 0%;
	border-radius: 999px;
	background: linear-gradient(90deg, #8FB4D6 0%, #A9C9E6 55%, #9DBFDD 100%);
	box-shadow:
	  0 0 9px rgba(160, 200, 240, .75),
	  0 0 19.5px rgba(120, 170, 225, .45);
  }

  .enter-btn {
	font-family: "FangSong", "仿宋", "STFangsong", "华文仿宋", serif;
	font-size: 14px;
	line-height: 1.4;
	text-align: center;
	letter-spacing: .2em;
	color: #eaf6ff;
	padding: 10px 18px;
	margin-top: 16.5px;
	text-shadow:
	  0 0 6px rgba(170, 215, 255, .95),
	  0 0 14px rgba(120, 175, 235, .70);
	opacity: 0;
	pointer-events: none;
	cursor: pointer;
	user-select: none;
	transition:
	  opacity .6s ease,
	  transform .7s cubic-bezier(.35, 0, .4, 1),
	  filter .7s ease,
	  text-shadow .3s ease;
  }
  .enter-btn.show { opacity: .95; pointer-events: auto; }
  .enter-btn.show:hover {
	opacity: 1;
	text-shadow: 0 0 8px #cfe9ff, 0 0 20px rgba(150, 200, 255, .9);
  }

  .title.dissolve {
	animation: none;
	opacity: 0;
	filter: blur(14px);
	transform: translateY(-24px) scale(.96);
  }
  .progress-wrap.dissolve {
	animation: none;
	opacity: 0;
	filter: blur(12px);
	transform: translateY(24px) scale(.96);
  }
  .enter-btn.expand {
	opacity: 0;
	transform: scale(2.8);
	filter: blur(10px);
  }

  /* ================= 第二页 ================= */
  #page2 {
	z-index: 5;
	opacity: 0;
	visibility: hidden;
	pointer-events: none;
	background:
	  radial-gradient(circle at 50% 26%, rgba(22, 36, 56, .70), rgba(0, 0, 0, 0) 62%),
	  #000;
  }
  #page2.active { opacity: 1; visibility: visible; pointer-events: auto; }

  .page-inner {
	position: relative;
	z-index: 2;
	height: 100%;
	overflow-y: auto;
	overflow-x: hidden;
	display: flex;
	justify-content: center;
	align-items: flex-start;
	padding: 6vh 20px 8vh;
	-webkit-overflow-scrolling: touch;
  }

  .content-col {
	width: min(560px, 90vw);
	display: flex;
	flex-direction: column;
	gap: 18px;
  }

  .player {
	width: 100%;
	height: fit-content;
	display: flex;
	gap: 20px;
	align-items: center;
	padding: 20px 22px;
	border-radius: 28px;
	border: 1px solid rgba(170, 210, 250, .20);
	background: rgba(24, 34, 50, 0.30);
	backdrop-filter: blur(16px) saturate(130%);
	-webkit-backdrop-filter: blur(16px) saturate(130%);
	box-shadow:
	  0 10px 42px rgba(0, 0, 0, .50),
	  0 0 26px rgba(120, 170, 225, .16),
	  inset 0 0 26px rgba(150, 195, 245, .05);
  }

  #page2.active .player {
	animation: playerIn 1.1s cubic-bezier(.22, .61, .36, 1) .15s both;
  }

  @keyframes playerIn {
	from { opacity: 0; transform: translateY(-18px); filter: blur(8px); }
	to   { opacity: 1; transform: translateY(0);     filter: blur(0);   }
  }

  .cover {
	flex: 0 0 auto;
	width: 90px;
	height: 90px;
	border-radius: 18px;
	border: 1px solid rgba(160, 200, 240, .28);
	background:
	  radial-gradient(circle at 30% 25%, rgba(143, 180, 214, .30), transparent 60%),
	  linear-gradient(145deg, rgba(60, 80, 105, .40), rgba(20, 28, 40, .55));
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 28px;
	color: rgba(200, 225, 255, .55);
	text-shadow: 0 0 12px rgba(150, 200, 255, .5);
	overflow: hidden;
	box-shadow: 0 0 16px rgba(120, 170, 225, .22);
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .info {
	flex: 1 1 auto;
	min-width: 0;
	display: flex;
	flex-direction: column;
	gap: 8px;
  }

  .song-title {
	font-family: "FangSong", "仿宋", "STFangsong", serif;
	font-size: 17px;
	letter-spacing: .08em;
	color: #f0f8ff;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
	text-shadow: 0 0 10px rgba(140, 195, 255, .55);
  }

  .artist {
	font-family: "FangSong", "仿宋", "STFangsong", serif;
	font-size: 12px;
	letter-spacing: .1em;
	color: rgba(190, 215, 240, .75);
  }

  .progress {
	margin-top: 4px;
	width: 100%;
	height: 4px;
	border-radius: 999px;
	background: rgba(255, 255, 255, .12);
	overflow: hidden;
	cursor: pointer;
  }
  .progress-fill {
	height: 100%;
	width: 0%;
	border-radius: 999px;
	background: linear-gradient(90deg, #8FB4D6, #A9C9E6);
	box-shadow: 0 0 8px rgba(160, 200, 240, .8);
  }

  .time-row {
	display: flex;
	justify-content: space-between;
	font-family: Consolas, "Courier New", monospace;
	font-size: 10px;
	color: rgba(180, 210, 240, .6);
	letter-spacing: .05em;
  }

  .controls {
	display: flex;
	align-items: center;
	gap: 16px;
	margin-top: 2px;
  }

  .ctrl {
	display: flex;
	align-items: center;
	justify-content: center;
	border: none;
	background: transparent;
	color: rgba(210, 230, 250, .85);
	cursor: pointer;
	padding: 0;
	transition: color .25s ease, transform .25s ease, box-shadow .25s ease;
  }
  .ctrl:hover { color: #fff; transform: scale(1.08); }

  .ctrl.side {
	width: 30px;
	height: 30px;
	border-radius: 50%;
	border: 1px solid rgba(160, 200, 240, .3);
  }

  .ctrl.play {
	width: 44px;
	height: 44px;
	border-radius: 50%;
	color: #0b1220;
	background: linear-gradient(145deg, #B4D2EE, #7FA9CF);
	box-shadow:
	  0 0 14px rgba(150, 200, 245, .65),
	  0 0 30px rgba(120, 170, 225, .35);
  }
  .ctrl.play:hover {
	box-shadow:
	  0 0 18px rgba(180, 220, 255, .85),
	  0 0 40px rgba(130, 180, 235, .5);
  }

  .playlist-bar {
	display: flex;
	align-items: center;
	gap: 10px;
	margin-top: 6px;
	padding-top: 12px;
	border-top: 1px solid rgba(170, 210, 250, .14);
	flex-wrap: wrap;
  }

  .playlist-label {
	flex: 0 0 auto;
	font-family: "FangSong", "仿宋", "STFangsong", serif;
	font-size: 11px;
	letter-spacing: .12em;
	color: rgba(180, 210, 240, .55);
  }

  .playlist {
	display: flex;
	align-items: center;
	gap: 8px;
	flex-wrap: wrap;
	flex: 1 1 auto;
	min-width: 0;
  }

  .song-chip {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	padding: 6px 14px;
	border-radius: 999px;
	border: 1px solid rgba(160, 200, 240, .30);
	background: rgba(143, 180, 214, .10);
	color: #dbeaf8;
	font-family: "FangSong", "仿宋", "STFangsong", serif;
	font-size: 12px;
	letter-spacing: .06em;
	cursor: pointer;
	white-space: nowrap;
	user-select: none;
	transition: background .25s ease, color .25s ease, box-shadow .25s ease, border-color .25s ease;
	max-width: 100%;
	overflow: hidden;
	text-overflow: ellipsis;
  }
  .song-chip:hover { background: rgba(143, 180, 214, .24); color: #fff; }
  .song-chip.active {
	background: linear-gradient(145deg, rgba(180, 212, 240, .95), rgba(127, 169, 207, .95));
	border-color: rgba(200, 230, 255, .85);
	color: #0b1220;
	font-weight: 700;
	box-shadow:
	  0 0 12px rgba(150, 200, 245, .60),
	  0 0 26px rgba(120, 170, 225, .32);
  }
  .song-chip .chip-icon { flex: 0 0 auto; display: inline-flex; }

  .greeting {
	display: flex;
	align-items: center;
	justify-content: flex-start;
	gap: 34px;
	padding: 0;
	border: none;
	background: none;
	box-shadow: none;
  }

  #page2.active .greeting {
	animation: greetingIn 1.2s cubic-bezier(.22, .61, .36, 1) 1.05s both;
  }

  @keyframes greetingIn {
	from { opacity: 0; transform: translateY(16px); filter: blur(8px); }
	to   { opacity: 1; transform: translateY(0);    filter: blur(0);   }
  }

  .greet-text {
	font-family: "Classico", "Classico Pro", "FangSong", "仿宋", Georgia, serif;
	font-size: 20px;
	line-height: 1.7;
	letter-spacing: .14em;
	color: #ffffff;
	text-shadow: 0 0 12px rgba(150, 200, 255, .55);
	white-space: nowrap;
  }

  .greet-name {
	display: inline-block;
	font-size: 2em;
	line-height: 1.1;
	letter-spacing: .1em;
  }

  .datetime-row {
	flex: 0 0 auto;
	display: flex;
	align-items: center;
	gap: 22px;
  }

  .clock-wrap,
  .date-wrap {
	display: flex;
	flex-direction: column;
	align-items: flex-end;
	gap: 4px;
  }

  .clock-label {
	font-family: "Classico", "Classico Pro", Georgia, serif;
	font-size: 10px;
	letter-spacing: .22em;
	color: #ffffff;
	opacity: .55;
	white-space: nowrap;
  }

  .clock {
	font-family: "Classico", "Classico Pro", Georgia, Consolas, monospace;
	font-size: 18px;
	letter-spacing: .10em;
	color: #ffffff;
	text-shadow: 0 0 14px rgba(150, 200, 255, .70);
	font-variant-numeric: tabular-nums;
	white-space: nowrap;
  }

  .date {
	font-family: "Classico", "Classico Pro", Georgia, Consolas, monospace;
	font-size: 18px;
	letter-spacing: .10em;
	color: #ffffff;
	text-shadow: 0 0 14px rgba(150, 200, 255, .70);
	font-variant-numeric: tabular-nums;
	white-space: nowrap;
  }

  /* ================= 弹窗区域 ================= */
  .toast-area {
	display: flex;
	flex-direction: column;
	gap: 10px;
	margin-top: 6px;
  }

  .toast-item {
	position: relative;
	width: 100%;
	display: flex;
	gap: 11px;
	align-items: flex-start;
	padding: 11px 14px;
	border-radius: 16px;
	border: 1px solid rgba(170, 210, 250, .18);
	background: rgba(28, 38, 55, .86);
	backdrop-filter: blur(18px) saturate(140%);
	-webkit-backdrop-filter: blur(18px) saturate(140%);
	box-shadow:
	  0 10px 30px rgba(0, 0, 0, .55),
	  0 0 18px rgba(120, 170, 225, .10);
	cursor: pointer;
	user-select: none;
	transform: translateY(280px);
	opacity: 0;
	transition:
	  transform 1.1s cubic-bezier(.22, .61, .36, 1),
	  opacity .75s ease,
	  border-color .4s ease,
	  box-shadow .4s ease;
	will-change: transform, opacity;
  }
  .toast-item.entered { transform: translateY(0); opacity: 1; }

  .toast-item[data-jump] { cursor: pointer; }
  .toast-item[data-jump]::before {
	content: "点击进入 →";
	position: absolute;
	right: 14px;
	bottom: 8px;
	font-family: "FangSong", "仿宋", "STFangsong", serif;
	font-size: 10px;
	letter-spacing: .06em;
	color: rgba(150, 200, 245, .55);
	pointer-events: none;
  }

  .toast-icon {
	flex: 0 0 auto;
	width: 34px;
	height: 34px;
	border-radius: 10px;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 17px;
	background: linear-gradient(145deg, rgba(180, 210, 238, .95), rgba(127, 169, 207, .95));
	box-shadow: 0 0 12px rgba(150, 200, 245, .45);
	overflow: hidden;
	position: relative;
  }
  .toast-icon img {
	width: 100%;
	height: 100%;
	object-fit: cover;
	display: block;
	border-radius: inherit;
  }

  .toast-icon[data-avatar-key] { cursor: pointer; }
  .toast-icon[data-avatar-key]::after {
	content: "✎";
	position: absolute;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 14px;
	color: #fff;
	background: rgba(10, 16, 26, .55);
	opacity: 0;
	transition: opacity .25s ease;
	pointer-events: none;
  }
  .toast-icon[data-avatar-key]:hover::after { opacity: 1; }

  .toast-body {
	flex: 1 1 auto;
	min-width: 0;
	display: flex;
	flex-direction: column;
	gap: 2px;
  }

  .toast-head {
	display: flex;
	align-items: baseline;
	justify-content: space-between;
	gap: 8px;
  }

  .toast-name {
	font-size: 12.5px;
	font-weight: 700;
	letter-spacing: .02em;
	color: #eaf4ff;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
	text-shadow: 0 0 8px rgba(150, 200, 255, .35);
  }

  .toast-time {
	flex: 0 0 auto;
	font-size: 10px;
	color: rgba(175, 205, 235, .55);
  }

  .toast-msg {
	font-size: 12.5px;
	line-height: 1.5;
	color: rgba(220, 235, 250, .86);
	display: -webkit-box;
	-webkit-line-clamp: 2;
	-webkit-box-orient: vertical;
	overflow: hidden;
	word-break: break-word;
  }

  .toast-item.expanded {
	border-color: rgba(170, 210, 250, .42);
	box-shadow:
	  0 16px 44px rgba(0, 0, 0, .62),
	  0 0 26px rgba(140, 190, 245, .28),
	  inset 0 0 20px rgba(150, 195, 245, .06);
  }
  .toast-item.expanded .toast-msg {
	display: block;
	-webkit-line-clamp: unset;
	overflow: visible;
  }

  /* ================= 右上角音乐控制按钮 ================= */
  #musicFab {
	position: fixed;
	top: 18px;
	right: 18px;
	z-index: 999;
	width: 46px;
	height: 46px;
	border-radius: 50%;
	display: flex;
	align-items: center;
	justify-content: center;
	border: 1px solid rgba(170, 210, 250, .35);
	background: rgba(20, 30, 45, .62);
	backdrop-filter: blur(14px) saturate(140%);
	-webkit-backdrop-filter: blur(14px) saturate(140%);
	box-shadow:
	  0 6px 20px rgba(0, 0, 0, .45),
	  0 0 14px rgba(120, 170, 225, .20);
	cursor: pointer;
	user-select: none;
	transition: background .25s ease, box-shadow .25s ease, transform .25s ease;
  }
  #musicFab:hover {
	background: rgba(30, 44, 64, .78);
	box-shadow:
	  0 8px 26px rgba(0, 0, 0, .55),
	  0 0 20px rgba(140, 190, 245, .35);
  }
  #musicFab svg { width: 22px; height: 22px; color: #dbeaf8; display: block; }
  #musicFab.playing svg {
	animation: spin 3.4s linear infinite;
	transform-origin: 50% 50%;
  }
  @keyframes spin {
	from { transform: rotate(0deg); }
	to   { transform: rotate(360deg); }
  }

  /* ================= 第三页：密钥验证 ================= */
  #pageKey {
	z-index: 6;
	display: flex;
	align-items: center;
	justify-content: center;
	background: #000;
	opacity: 0;
	visibility: hidden;
	pointer-events: none;
	transition: opacity .4s ease, visibility .4s ease;
  }
  #pageKey.active { opacity: 1; visibility: visible; pointer-events: auto; }

  .key-card {
	width: min(360px, 86vw);
	padding: 34px 28px 30px;
	border-radius: 24px;
	border: 1px solid rgba(170, 210, 250, .22);
	background: rgba(20, 30, 45, .55);
	backdrop-filter: blur(18px) saturate(140%);
	-webkit-backdrop-filter: blur(18px) saturate(140%);
	box-shadow:
	  0 18px 50px rgba(0, 0, 0, .62),
	  0 0 28px rgba(120, 170, 225, .14),
	  inset 0 0 26px rgba(150, 195, 245, .05);
	display: flex;
	flex-direction: column;
	gap: 16px;
  }

  #pageKey.active .key-card {
	animation: keyCardIn .8s cubic-bezier(.22, .61, .36, 1) both;
  }
  @keyframes keyCardIn {
	from { opacity: 0; transform: translateY(20px) scale(.96); filter: blur(6px); }
	to   { opacity: 1; transform: translateY(0) scale(1);      filter: blur(0);   }
  }

  .key-title {
	text-align: center;
	font-family: "FangSong", "仿宋", "STFangsong", "华文仿宋", serif;
	font-size: 19px;
	letter-spacing: .18em;
	color: #eef7ff;
	text-shadow:
	  0 0 8px rgba(170, 215, 255, .75),
	  0 0 20px rgba(120, 175, 235, .45);
  }

  .key-error {
	min-height: 18px;
	font-family: "FangSong", "仿宋", "STFangsong", "华文仿宋", serif;
	font-size: 12.5px;
	letter-spacing: .06em;
	color: #ff5d5d;
	text-align: center;
	text-shadow: 0 0 8px rgba(255, 80, 80, .45);
	opacity: 0;
	transition: opacity .25s ease;
  }
  .key-error.show { opacity: 1; }

  .key-input {
	width: 100%;
	padding: 11px 14px;
	border-radius: 12px;
	border: 1px solid rgba(160, 200, 240, .32);
	background: rgba(10, 16, 26, .55);
	color: #eaf4ff;
	font-family: Consolas, "Courier New", monospace;
	font-size: 14px;
	letter-spacing: .12em;
	outline: none;
	transition: border-color .25s ease, box-shadow .25s ease;
  }
  .key-input::placeholder {
	color: rgba(170, 200, 230, .38);
	letter-spacing: .08em;
  }
  .key-input:focus {
	border-color: rgba(180, 215, 255, .70);
	box-shadow: 0 0 14px rgba(140, 190, 245, .30);
  }

	const c = document.createElement('canvas');

	ctx.translate(32, 32);
	ctx.strokeStyle = '#ffffff';
	ctx.lineWidth = 3;
	ctx.lineCap = 'round';
	for (let i = 0; i < 6; i++) {
	  ctx.rotate(Math.PI / 3);
	  ctx.beginPath(); ctx.moveTo(0, 0);   ctx.lineTo(0, -26); ctx.stroke();
	  ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(-8, -19); ctx.stroke();
	  ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(8, -19);  ctx.stroke();
	}
	return c.toDataURL();
  }

  const AVATAR_STORAGE_PREFIX = 'bday_avatar_';
  const AVATAR_SIZE = 128;

  const avatarFileInput = document.createElement('input');
  avatarFileInput.type = 'file';
  avatarFileInput.accept = 'image/*';

  let pendingAvatarKey = null;

  function getStoredAvatar(key) {
	try { return localStorage.getItem(AVATAR_STORAGE_PREFIX + key) || null; }
	catch (e) { return null; }
  }

  function setStoredAvatar(key, dataUrl) {
	try { localStorage.setItem(AVATAR_STORAGE_PREFIX + key, dataUrl); return true; }
	catch (e) { console.warn('[头像保存失败]', e); return false; }
  }

  function compressImage(file, size) {
	return new Promise(function (resolve, reject) {
	  const reader = new FileReader();
	  reader.onload = function (e) {
		const img = new Image();
		img.onload = function () {
		  const canvas = document.createElement('canvas');
		  canvas.width = canvas.height = size;
		  const ctx = canvas.getContext('2d');

		  const s  = Math.min(img.width, img.height);
		  const sx = (img.width  - s) / 2;
		  const sy = (img.height - s) / 2;
		  ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);

		  try { resolve(canvas.toDataURL('image/jpeg', 0.85)); }
		  catch (err) { reject(err); }
		};
		img.onerror = reject;
		img.src = e.target.result;
	  };
	  reader.onerror = reject;
	  reader.readAsDataURL(file);
	});
  }

  function renderAvatar(iconBox, src, fallbackIcon) {
	iconBox.innerHTML = '';
	if (src) {
	  const img = document.createElement('img');
	  img.src = src;
	  img.alt = '';
	  img.onerror = function () {
		iconBox.innerHTML = '';
		iconBox.textContent = fallbackIcon || '🎂';
	  };
	  iconBox.appendChild(img);
	} else {
	  iconBox.textContent = fallbackIcon || '🎂';
	}
  }

  avatarFileInput.addEventListener('change', async function () {
	const file = avatarFileInput.files && avatarFileInput.files[0];
	const key  = pendingAvatarKey;
	avatarFileInput.value = '';
	pendingAvatarKey = null;

	if (!file || !key) return;

	try {
	  const dataUrl = await compressImage(file, AVATAR_SIZE);
	  const ok = setStoredAvatar(key, dataUrl);

	  document.querySelectorAll('[data-avatar-key="' + key + '"]').forEach(function (box) {
		renderAvatar(box, dataUrl, box.dataset.fallbackIcon);

	if (keyEntering) return;
	if (pageKey.classList.contains('active')) return;
	if (pageEditor.classList.contains('active')) return;
	if (pageVisitor.classList.contains('active')) return;

	keyEntering = true;
	currentContact = contact;

	const mySeq = ++navSeq;
	stopToastLoop();

	page2.classList.add('sand-out');

	setTimeout(function () {
	  if (mySeq !== navSeq) return;

	  page2.classList.remove('active', 'sand-out');

	  keyCard.classList.remove('sand-out');
	  keySubmit.disabled = false;
	  keySubmit.classList.remove('visible');
	  keyInput.value = '';
	  keyError.classList.remove('show');
	  keyError.textContent = '密码错误，请重新输入...';
	  keyUnlocked = false;

	  pageKey.classList.add('active');
	  setTimeout(function () { keyInput.focus(); }, 400);
	}, 1000);
  }

  keyInput.addEventListener('input', function () {
	keySubmit.classList.toggle('visible', keyInput.value.length > 0);
	keyError.classList.remove('show');
  });

  keyInput.addEventListener('keydown', function (e) {
	if (e.key === 'Enter') submitKey();
  });

  keySubmit.addEventListener('click', submitKey);

  function submitKey() {
	if (keyUnlocked || !currentContact) return;

	const val = keyInput.value.trim();
	if (!val) return;

	const contact = currentContact;

	if (val === EDIT_PASS) {
	  /* ---------- 编辑页 ---------- */
	  keyUnlocked = true;
	  keySubmit.disabled = true;

	  const mySeq = ++navSeq;
	  sandDissolve(keyCard, function () {
		if (mySeq !== navSeq) return;

		pageKey.classList.remove('active');
		pageEditor.classList.add('active');

		editorToEl.textContent = contact.toTitle;
		letterText.placeholder =
		  '在这里写下想对' + contact.shortName + '说的话，保存后访客将看到这段文字...';

		const saved = getSavedLetter(contact);
		const draft = loadDraft(contact);
		letterText.value = draft || saved || '';

		setTimeout(function () { letterText.focus(); }, 400);
	  });
	} else if (val === contact.viewPass) {
	  /* ---------- 访客页 ---------- */
	  const saved = getSavedLetter(contact);
	  if (!saved) {
		keyError.textContent = '暂无公开内容，请先用 ' + EDIT_PASS + ' 编辑并保存';
		keyError.classList.add('show');
		keyInput.select();
		return;
	  }

	  keyUnlocked = true;
	  keySubmit.disabled = true;

	  const mySeq = ++navSeq;
	  sandDissolve(keyCard, function () {
		if (mySeq !== navSeq) return;

		pageKey.classList.remove('active');
		pageVisitor.classList.add('active');

		visitorToEl.textContent = contact.toTitle;
		typeVisitor(saved);
	  });
	} else {
	  keyError.textContent = '密码错误，请重新输入...';
	  keyError.classList.add('show');
	  keyInput.select();
	}
  }

  function sandDissolve(card, done) {
	const rect = card.getBoundingClientRect();

	for (let i = 0; i < 46; i++) {
	  const p = document.createElement('div');
	  p.className = 'sand-particle';
	  const size = 2 + Math.random() * 4;
	  p.style.width  = size + 'px';
	  p.style.height = size + 'px';
	  p.style.left = (rect.left + Math.random() * rect.width) + 'px';
	  p.style.top  = (rect.top  + Math.random() * rect.height) + 'px';
	  p.style.setProperty('--dx', (Math.random() * 240 - 120).toFixed(0) + 'px');
	  p.style.setProperty('--dy', (80 + Math.random() * 220).toFixed(0) + 'px');
	  p.style.animationDelay = (Math.random() * .25).toFixed(2) + 's';

	  document.body.appendChild(p);
	  setTimeout(function () { p.remove(); }, 1700);
	}

	card.classList.add('sand-out');
	setTimeout(done, 1000);
  }

  /* ==================================================
	 10. 编辑页（按联系人独立草稿 / 独立留言）
	 ================================================== */
  letterText.addEventListener('input', function () {
	if (!currentContact) return;
	try { localStorage.setItem(currentContact.draftKey, letterText.value); } catch (e) {}
  });

  let statusTimer = null;
  function showStatus(text, isError) {
	letterStatus.textContent = text;
	letterStatus.style.color = isError ? '#ff8a8a' : 'rgba(150, 210, 180, .85)';
	letterStatus.classList.add('show');

	clearTimeout(statusTimer);
	statusTimer = setTimeout(function () {
	  letterStatus.classList.remove('show');
	}, 1800);
  }

  letterSave.addEventListener('click', function () {
	if (!currentContact) return;

	const val = letterText.value.trim();

	if (!val) {
	  showStatus('内容不能为空', true);
	  letterText.focus();
	  return;
	}

	try {
	  localStorage.setItem(currentContact.letterKey, val);
	  localStorage.removeItem(currentContact.draftKey);
	} catch (e) {}

	showStatus('已保存到本机，即将返回首页');

	setTimeout(function () {
	  backToHome();
	}, 1200);
  });

  letterUndo.addEventListener('click', function () {
	letterText.value = '';
	if (currentContact) {
	  try { localStorage.removeItem(currentContact.draftKey); } catch (e) {}
	}
	showStatus('已撤销');
	letterText.focus();
  });

  /* ==================================================
	 10.1 永久保存：把信件写入文件本身（跨设备可用）
	 ================================================== */
  letterPerm.addEventListener('click', function () {
	if (!currentContact) return;

	const val = letterText.value.trim();
	if (!val) {
	  showStatus('内容不能为空', true);
	  letterText.focus();
	  return;
	}

	/* 1. 同时写入本机，立即可见 */
	try {
	  localStorage.setItem(currentContact.letterKey, val);
	  localStorage.removeItem(currentContact.draftKey);
	} catch (e) {}

	/* 2. 更新内存中的默认内容 */
	DEFAULT_LETTERS[currentContact.key] = val;

	/* 3. 克隆整个页面，清理运行时产生的元素 */
	const clone = document.documentElement.cloneNode(true);

	const snow = clone.querySelector('#snow-layer');
	if (snow) snow.innerHTML = '';
	const ta = clone.querySelector('#toastArea');
	if (ta) ta.innerHTML = '';
	clone.querySelectorAll('.sand-particle').forEach(function (el) { el.remove(); });
	clone.querySelectorAll('input[type="file"]').forEach(function (el) { el.remove(); });

	/* 4. 重置动态文本，避免把“当前访问者”写进文件 */
	const lt = clone.querySelector('#letterText');
	if (lt) { lt.textContent = ''; lt.removeAttribute('placeholder'); }
	const vc = clone.querySelector('#visitorContent');
	if (vc) { vc.textContent = ''; vc.classList.remove('typing'); }
	const vto = clone.querySelector('#visitorTo');
	if (vto) vto.textContent = 'To：陈伶';
	const eto = clone.querySelector('#editorTo');
	if (eto) eto.textContent = 'To：陈伶';
	const kerr = clone.querySelector('#keyError');
	if (kerr) {
	  kerr.textContent = '密码错误，请重新输入...';
	  kerr.classList.remove('show');
	}
	const ki = clone.querySelector('#keyInput');
	if (ki) ki.removeAttribute('value');

	/* 5. 重置页面到初始状态 */
	clone.querySelectorAll('.page-layer').forEach(function (el) {
	  el.classList.remove('active', 'fade-out', 'sand-out');
	});
	const p1 = clone.querySelector('#page1');
	if (p1) p1.removeAttribute('style');
	const bb = clone.querySelector('#backBtn');
	if (bb) bb.removeAttribute('style');
	const mf = clone.querySelector('#musicFab');
	if (mf) mf.setAttribute('style', 'display: none;');
	const tt = clone.querySelector('#title');
	if (tt) tt.classList.remove('dissolve');
	const pw = clone.querySelector('#progressWrap');
	if (pw) pw.classList.remove('dissolve');
	const eb = clone.querySelector('#enterBtn');
	if (eb) eb.classList.remove('expand', 'show');
	const pf = clone.querySelector('#progressFill');
	if (pf) pf.style.width = '0%';
	const pn = clone.querySelector('#progressNum');
	if (pn) pn.textContent = '0%';
	const kc = clone.querySelector('.key-card');
	if (kc) kc.classList.remove('sand-out');
	const ks = clone.querySelector('#keySubmit');
	if (ks) {
	  ks.disabled = false;
	  ks.classList.remove('visible');
	}

	/* 6. 把最新内容写回脚本里的 DEFAULT_LETTERS 区域 */
	const scripts = clone.querySelectorAll('script');
	const mainScript = scripts[scripts.length - 1];
	if (mainScript) {
	  let code = mainScript.textContent;
	  const json = JSON.stringify(DEFAULT_LETTERS, null, 2).replace(/<\//g, '<\\/');
	  code = code.replace(
		/\/\* @DEFAULT_LETTERS_START \*\/[\s\S]*?\/\* @DEFAULT_LETTERS_END \*\//,
		function () {
		  return '/* @DEFAULT_LETTERS_START */\n' +
				 'const DEFAULT_LETTERS = ' + json + ';\n' +
				 '/* @DEFAULT_LETTERS_END */';
		}
	  );
	  mainScript.textContent = code;
	}

	/* 7. 下载新文件 */
	const html = '<!DOCTYPE html>\n' + clone.outerHTML;
	const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
	const url = URL.createObjectURL(blob);
	const a = document.createElement('a');
	a.href = url;
	a.download = '生日祝福_永久版.html';
	document.body.appendChild(a);
	a.click();
	document.body.removeChild(a);
	setTimeout(function () { URL.revokeObjectURL(url); }, 1000);

	showStatus('已下载永久版，用它替换原文件即可');
  });

  /* 点击 “To：xxx” 返回首页 */
  [editorToEl, visitorToEl].forEach(function (el) {
	el.addEventListener('click', function () {
	  backToHome();
	});
  });

  /* ==================================================
	 11. 访客页（带可中断的打字机）
	 ================================================== */
  function typeVisitor(text) {
	const mySeq = ++visitorTypeSeq;

	visitorContent.textContent = '';
	visitorContent.classList.add('typing');

	let i = 0;
	const speed = text.length > 300 ? 18 : 32;

	function step() {
	  if (mySeq !== visitorTypeSeq) return;
	  if (i >= text.length) {
		visitorContent.classList.remove('typing');
		return;
	  }
	  visitorContent.textContent += text.charAt(i++);
	  setTimeout(step, speed);
	}
	step();
  }

})();
</script>
 </body>
</html>
